{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card p-4">
      <h4 class="mb-3 text-center">تعیین رمز عبور جدید</h4>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">رمز عبور جدید</label>
          {{ form.password }}
        </div>
        <div class="mb-3">
          <label class="form-label">تکرار رمز عبور</label>
          {{ form.password_confirm }}
        </div>
        {% if form.non_field_errors %}<div class="text-danger small">{{ form.non_field_errors }}</div>{% endif %}
        <button class="btn btn-primary w-100" type="submit">ثبت رمز جدید</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
