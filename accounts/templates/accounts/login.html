{% extends "base.html" %}
{% block title %}ورود پزشکان{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card p-4">
      <div class="text-center mb-3">
        <i class="bi bi-clipboard2-pulse display-6 text-primary"></i>
        <h4 class="mt-2">ورود پزشکان</h4>
        <p class="text-muted small">این صفحه مخصوص ورود پزشکان به داشبورد مدیریت نوبت‌هاست.</p>
      </div>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">شماره تلفن یا ایمیل</label>
          {{ form.identifier }}
        </div>
        <div class="mb-3">
          <label class="form-label">رمز عبور</label>
          {{ form.password }}
        </div>
        <button class="btn btn-primary w-100" type="submit">ورود</button>
      </form>
      <hr>
      <p class="text-center small text-muted mb-0">بیمار هستید؟ <a href="{% url 'accounts:login' %}">ورود کاربران از اینجا</a></p>
    </div>
  </div>
</div>
{% endblock %}
