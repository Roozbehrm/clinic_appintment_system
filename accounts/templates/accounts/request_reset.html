{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card p-4">
      <h4 class="mb-3 text-center">بازیابی رمز عبور</h4>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">شماره تلفن</label>
          {{ form.phone_number }}
        </div>
        <button class="btn btn-primary w-100" type="submit">ارسال کد تایید</button>
      </form>
      <div class="text-center mt-3">
        <a href="{% url 'accounts:request_reset_email' %}">به‌جای شماره تلفن، با ایمیل بازیابی کنم</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
