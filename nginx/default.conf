# تنظیمات nginx به‌عنوان reverse proxy جلوی gunicorn (سرویس web)،
# و سرو مستقیم فایل‌های استاتیک/مدیا از همون volume هایی که در
# docker-compose.yml تعریف شدن (static_volume, media_volume).

upstream clinic_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://clinic_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
